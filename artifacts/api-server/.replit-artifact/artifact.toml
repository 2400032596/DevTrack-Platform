kind = "api"
previewPath = "/api"
title = "DevTrack API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "mvn -f ../../backend/pom.xml spring-boot:run"

[services.production]

[services.production.build]
args = ["mvn", "-B", "-f", "../../backend/pom.xml", "-DskipTests", "package"]

[services.production.run]
args = ["java", "-XX:MaxRAMPercentage=75", "-jar", "../../backend/target/devtrack-api-1.0.0.jar"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
